name: Argo
options:
  bundleIdPrefix: blog.argosnewdreams
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "20261117.0905"
    # Imposta qui il tuo Team ID (Xcode › Settings › Accounts) oppure sceglilo in Xcode
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Argo:
    type: application
    platform: iOS
    sources:
      - path: Argo
    settings:
      base:
        PRODUCT_NAME: Argo
        PRODUCT_BUNDLE_IDENTIFIER: blog.argosnewdreams.argo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Argo/Info.plist
      properties:
        CFBundleDisplayName: Argo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Argo usa il microfono per registrare le riunioni. L'audio resta sul tuo iPhone."
        NSLocalNetworkUsageDescription: "Argo può chiedere al tuo Mac in rete locale (Ollama) di scrivere il verbale."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSpeechRecognitionUsageDescription: "Argo trascrive le registrazioni direttamente sul tuo iPhone, senza inviarle a server esterni."
