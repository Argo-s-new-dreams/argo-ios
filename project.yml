name: Argo
options:
  bundleIdPrefix: blog.argosnewdreams
  # Interfaccia in italiano (lingua di sviluppo), inglese, spagnolo e tedesco: Argo/Localizable.xcstrings
  # e Argo/InfoPlist.xcstrings (permessi). iOS mostra la scelta in Impostazioni › Argo › Lingua.
  developmentLanguage: it
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "20261128.0738"
    # Imposta qui il tuo Team ID (Xcode › Settings › Accounts) oppure sceglilo in Xcode
    DEVELOPMENT_TEAM: "WPR2P5Q2S8"
    CODE_SIGN_STYLE: Automatic

packages:
  # Diarizzazione on-device (pipeline pyannote in CoreML). Licenze di codice e modelli: da verificare (vedi README)
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.12.4
  # Argo Live (laboratorio): motore LiteRT-LM di Google per Gemma 4 E2B sul telefono (Apache 2.0)
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    from: 0.19.1

targets:
  Argo:
    type: application
    platform: iOS
    sources:
      - path: Argo
    dependencies:
      - package: FluidAudio
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_NAME: Argo
        PRODUCT_BUNDLE_IDENTIFIER: blog.argosnewdreams.argo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # CarPlay (Argo Live): autorizzazione «voice-based conversation» concessa da Apple il 27/11/2026,
        # vale per tutte le build (simulatore e telefono). Il profilo di distribuzione deve includerla.
        CODE_SIGN_ENTITLEMENTS: Argo/Argo.entitlements
        # LiteRT-LM ha la libreria per il simulatore solo arm64
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: Argo/Info.plist
      properties:
        CFBundleDisplayName: Argo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        # Schermata CarPlay di Argo Live (CarPlayLive.swift); la scena del telefono resta quella di SwiftUI
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlayLive
        ITSAppUsesNonExemptEncryption: false
        # File .argovoci (anagrafe voci da Argo desktop): «Apri con Argo» da AirDrop e File
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: blog.argosnewdreams.argovoci
            UTTypeDescription: Anagrafe voci di Argo
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [argovoci]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anagrafe voci di Argo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [blog.argosnewdreams.argovoci]
        NSCameraUsageDescription: "Argo usa la fotocamera per fotografare biglietti da visita e documenti durante un incontro. Le foto restano nell'app."
        NSMicrophoneUsageDescription: "Argo usa il microfono per registrare le riunioni. L'audio resta sul tuo iPhone."
        NSBonjourServices: [_argoponte._tcp]
        NSLocalNetworkUsageDescription: "Argo si collega in rete locale ad Argo sul tuo computer, con un canale cifrato, per inviare gli incontri e ricevere l'anagrafe voci, e facoltativamente a Ollama per la relazione."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSpeechRecognitionUsageDescription: "Argo trascrive le registrazioni direttamente sul tuo iPhone, senza inviarle a server esterni."
